<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Pohjanpiha Festival</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="listing.html">Lineup</a>
    <a href="about.html">Area</a>
    <a href="contact.html">Contact</a>
    <a href="https://www.lippu.fi">Tickets</a>
  </nav>

  <main>
    <h1>Contact</h1>
    <p>Ask us anything about the festival or the area.</p>

    <form id="question-form" novalidate>
      <div>
        <label for="name">Name</label>
        <input type="text" id="name">
        <span class="error" id="name-error"></span>
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email">
        <span class="error" id="email-error"></span>
      </div>

      <div>
        <label for="question">Your question</label>
        <textarea id="question" rows="5"></textarea>
        <span class="error" id="question-error"></span>
      </div>

      <button type="submit">Send question</button>
    </form>

    <p id="form-status"></p>
  </main>

  <footer>
    <p>Pohjanpiha Festival, Alavus</p>
  </footer>

  <script src="js/form.js"></script>
</body>
</html>
